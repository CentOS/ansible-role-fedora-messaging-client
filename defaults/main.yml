# Defaults variables for role fedora-messaging-client
# Worth knowing that this role is mostly to be imported/included from other roles, but good to have in one place

# To enable only on impacted machines
# infra tags are using stream10 and python3-cryptography was in buildroot so some pkgs need it while waiting for rhel 10.3 to be release
# Turn boolean on specific host if needed
fedora_messaging_el10_workaround: False
fedora_messaging_techpreview_pkgs:
  - http://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/Packages/python3-cryptography-48.0.0-3.el10.x86_64.rpm



# Do we want to directly ship specific TLS certs ?
# fedora-messaging pkgs already contains generic certs, but we can also have specific ones allowed for
# some topics for pub/sub
# These files should be in {{ pkistore }}/fedora-messaging
fedora_messaging_tls_certs: False
fedora_messaging_tls_cert:
fedora_messaging_tls_key:
fedora_messaging_tls_ca:

# Zabbix/monitoring part
fmn_zabbix_templates:
  - Template CentOS FMN consumer
fmn_zabbix_groups:
  - CentOS FMN consumers
